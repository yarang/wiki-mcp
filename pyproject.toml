[project]
name = "wiki-mcp"
version = "0.2.4"
description = "MCP server exposing a Korean atomic-note wiki — search, read, and natural-language CRUD with BM25+dense hybrid retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "William Jung"}]
keywords = ["mcp", "wiki", "rag", "obsidian", "llm", "korean"]
dependencies = [
    "mcp[cli]>=1.0",
    "chromadb>=0.4.22",
    "python-frontmatter>=1.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "watchdog>=3.0",
    "pydantic>=2.0",
    # Streamable HTTP transport (원격 daemon 모드)
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0", "build>=1.0"]

[project.scripts]
# CLI entrypoints — installed on PATH by `pip install`
wiki-mcp = "wiki_mcp.server:main"
wiki-mcp-watch = "wiki_mcp.watch:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# src 레이아웃 + tests/conftest 헬퍼를 import 가능하게 경로에 추가
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

# examples/ live outside the package (in the repo source tree) and are not
# packaged into the wheel — users get them via git clone or the repo README.
[tool.setuptools.package-data]
wiki_mcp = []

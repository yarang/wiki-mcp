name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]
        # 최소 지원 버전(3.10)도 한 OS에서 검증한다.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.21"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # [embed](chromadb)은 설치하지 않는다 — 없는 환경에서 전체 테스트가
      # 통과해야 한다. 문서 추출 라이브러리는 0.3.1부터 기본 의존성이라
      # 추출기 테스트가 skip 되지 않는다.
      - name: Sync dependencies (dev only)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Ruff check
        run: uv run --extra dev ruff check .

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: Pytest
        run: uv run --extra dev pytest -q
